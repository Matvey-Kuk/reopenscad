<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ReOpenSCAD">
  <title>ReOpenSCAD</title>
  <!--
    Original ReOpenSCAD mark, drawn for this project.

    A boolean-geometry motif: a block with a bore drilled out of it
    (difference), overlapped by a cylinder (union), with the region the two
    share lit up (intersection). All three CSG operations in one flat, chunky
    silhouette that still reads at a 16px favicon. The bore is a real
    transparent subtraction (evenodd), so the mark sits on any background.
  -->
  <defs>
    <clipPath id="rs-block">
      <rect x="2.5" y="2.5" width="18" height="18" rx="3.6" />
    </clipPath>
  </defs>

  <!-- block, minus bore -->
  <path
    fill="#89c454"
    fill-rule="evenodd"
    d="M6.1 2.5H16.9A3.6 3.6 0 0 1 20.5 6.1V16.9A3.6 3.6 0 0 1 16.9 20.5H6.1A3.6 3.6 0 0 1 2.5 16.9V6.1A3.6 3.6 0 0 1 6.1 2.5Z
       M12.7 9.5A3.1 3.1 0 1 0 6.5 9.5A3.1 3.1 0 1 0 12.7 9.5Z" />

  <!-- cylinder, unioned -->
  <circle cx="21" cy="21" r="8.5" fill="#55a9e8" />

  <!-- the shared volume -->
  <circle cx="21" cy="21" r="8.5" fill="#eef6e2" clip-path="url(#rs-block)" />
</svg>
